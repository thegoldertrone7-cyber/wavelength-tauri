[package]
name = "wavelength"
version = "2.9.0"
description = "Wavelength desktop core"
authors = ["Wavelength"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wavelength_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wavelength"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "process", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "vorbis", "wav", "flac"] }
rustfft = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
